<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1e8" />
  <title>测测你的本命定居城市</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <span class="brand-dot" aria-hidden="true"></span>
      <p>测测你的本命定居城市 <span>|</span> 你最适合在哪长期定居？</p>
    </header>

    <section id="cover" class="screen cover active" aria-labelledby="cover-title">
      <div class="cover-art" aria-hidden="true">
        <span class="sun"></span><span class="cloud cloud-a"></span><span class="cloud cloud-b"></span>
        <span class="hill hill-a"></span><span class="hill hill-b"></span>
        <span class="house">⌂</span>
      </div>
      <p class="eyebrow">CITY MATCH · 15 QUESTIONS</p>
      <h1 id="cover-title">哪座城市，<br><em>最懂你的生活节奏？</em></h1>
      <p class="intro">不看星座，也不靠玄学。用 15 个关于气候、通勤、口味与生活期待的小选择，找到更适合你长期生活的那座城。</p>
      <div class="cover-tags"><span>国内 25 城</span><span>海外 25 城</span><span>约 3 分钟</span></div>
      <button id="start-btn" class="primary">开始测试 <span>→</span></button>
      <p class="fineprint">凭第一感觉选就好，没有标准答案</p>
    </section>

    <section id="quiz" class="screen quiz" aria-live="polite">
      <div class="progress-row"><span id="progress-text">01 / 15</span><span id="progress-percent">7%</span></div>
      <div class="progress-track"><i id="progress-bar"></i></div>
      <div class="question-card">
        <p id="question-kicker" class="question-kicker">关于天气</p>
        <h2 id="question-title"></h2>
        <div id="options" class="options" role="radiogroup"></div>
      </div>
      <div class="quiz-actions">
        <button id="prev-btn" class="ghost">← 上一题</button>
        <button id="next-btn" class="primary" disabled>下一题 <span>→</span></button>
      </div>
    </section>

    <section id="result" class="screen result" aria-live="polite">
      <p class="eyebrow">YOUR CITY MATCH</p>
      <p class="result-label">你的本命定居城市是</p>
      <h1 id="city-name"></h1>
      <p id="city-country" class="city-country"></p>
      <div class="match-pill">匹配度 <strong id="match-score"></strong></div>
      <div class="result-card">
        <p id="city-quote" class="city-quote"></p>
        <div class="divider"></div>
        <p id="city-copy" class="city-copy"></p>
        <div id="city-tags" class="city-tags"></div>
      </div>
      <p class="share-note">长按截图，分享你的本命城市 ✦</p>
      <button id="restart-btn" class="ghost restart">↻ 重新测试</button>
      <p class="disclaimer">测试结果仅作生活偏好参考，真正的定居选择还要结合工作、预算与身份条件。</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
